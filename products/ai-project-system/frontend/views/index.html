<!doctype html>
<html lang="ko">
<head>
<!--
  2026-07-20 셸 적용 여부 판단: 이 랜딩 페이지는 GNB/LNB 공통 셸(shell.css/shell-nav.html)을
  의도적으로 적용하지 않는다 — 근거: (1) 아직 "시스템 안"이 아니라 진입 전 소개 화면이라
  좌측에 업무영역 메뉴를 보여주는 것이 오히려 첫인상에 불필요한 복잡도를 준다, (2) 이
  화면에서 갈 수 있는 곳은 "새 프로젝트 시작"/"요구사항 목록 보기" 2가지뿐이라 LNB형
  메뉴보다 현재의 큰 버튼 2개가 더 명확한 CTA다. project-setup/requirements/preview 3개
  업무 화면은 셸을 적용한다(frontend/js/shell-loader.js 참조).
-->
<meta charset="utf-8" />
<title>요구사항 기반 AI 개발 태스크 관리 시스템</title>
<link rel="stylesheet" href="../styles/tokens.css" />
<link rel="stylesheet" href="../styles/components.css" />
<style>
  /* .btn/.btn.primary는 components.css 재사용(2026-07-22) — 이 화면 전용만 남김 */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; }
  .hero h1 { font-size: 26px; margin: 0 0 10px; }
  .hero p.lead { font-size: 15px; color: var(--text-muted); max-width: 560px; line-height: 1.7; margin: 0 0 32px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 12px 22px; font-size: 14px; }
  .btn:hover { opacity: .9; }
  .flow { margin-top: 40px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; justify-content: center; }
  .flow .step { border: 1px solid var(--border-color); border-radius: 999px; padding: 5px 12px; }
  .flow .arrow { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="hero">
    <h1>요구사항 기반 AI 개발 태스크 관리 시스템</h1>
    <p class="lead">
      사업 착수 전 요구사항 문서(제안서·사업계획서·수행계획서·착수보고서·인터뷰 등)를 청킹·구조화해
      영역/분야별로 번호 관리하고, 이를 근거로 AI 개발 태스크를 충돌 없이 생성·수행·추적합니다.
    </p>
    <div class="actions">
      <a class="btn primary" href="project-setup.html">새 프로젝트 시작</a>
      <a class="btn" href="requirements.html">요구사항 목록 보기</a>
    </div>
    <div class="flow">
      <span class="step">1. 프로젝트 설정</span>
      <span class="arrow">→</span>
      <span class="step">2. 요구사항 검토</span>
      <span class="arrow">→</span>
      <span class="step">3. 상세 미리보기</span>
    </div>
  </div>
</body>
</html>
