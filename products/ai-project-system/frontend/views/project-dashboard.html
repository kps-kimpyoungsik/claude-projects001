<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>⑦ 프로젝트 대시보드 — 전체 프로젝트 한눈에 보기</title>
<link rel="stylesheet" href="../styles/tokens.css" />
<link rel="stylesheet" href="../styles/components.css" />
<link rel="stylesheet" href="../styles/shell.css" />
<style>
  /*
    [2026-07-26 신설] LNB ⑦ 프로젝트 대시보드 — 이전에는 프로젝트를 만든 뒤 그 프로젝트의
    이름/목표/진행상태를 한눈에 모아보거나, 만든 뒤 다시 편집하는 화면이 전혀 없었다
    (실측: project-setup.html은 create-only 마법사, GET /projects는 GNB select 안에서만
    소비됨). 이 화면은 그 갭을 메운다 — 신규 백엔드 집계 API는 만들지 않고(CRZ), 이미
    있는 GET /projects + GET /projects/{id}만 조합해 클라이언트에서 집계·렌더링한다.

    "키워드"는 요구사항 문서 전체를 확인했으나 별도 토픽 키워드 필드가 없어(project_config.json
    에는 solution_stack만 존재) 가장 근접한 기존 필드인 config.solution_stack(프레임워크/
    솔루션 태그)을 그대로 키워드로 표시한다 — 신규 필드 발명 없음(CRZ).

    공통 스타일(topbar-main·summary-card·badge-work류·empty-state)은 components.css/
    shell.css 재사용 — 이 화면 전용(카드 그리드·키워드 필그·상태 탭·진행바 wrap)만 로컬
    <style>에 남긴다(다른 화면과 동일한 관례, 2026-07-22 CRZ 원칙).
  */
  .content-body { padding: 24px; }
  .pd-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 8px; }
  .pd-header .pd-icon {
    font-size: 28px; width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--color-brand-primary) 14%, transparent);
  }
  h1 { font-size: 20px; margin: 0; }
  p.subtitle { color: var(--text-muted); font-size: 13px; margin: 4px 0 0; line-height: 1.6; max-width: 640px; }
  .summary-row { margin-bottom: 18px; }

  /* 상태 탭 — 5분류(전체/진행/완료/보류/삭제) 필터. workbase check-cards 톤 재사용(새 색 없음). */
  .pd-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .pd-tab {
    border: 1.5px solid rgba(128,128,128,.4); border-radius: 999px; padding: 6px 14px;
    font-size: 12px; font-weight: 700; cursor: pointer; background: var(--bg-primary); color: var(--text-primary);
  }
  .pd-tab:hover { border-color: var(--color-brand-primary); }
  .pd-tab.active { border-color: var(--color-brand-primary); background: color-mix(in srgb, var(--color-brand-primary) 12%, transparent); color: var(--brand-text); }

  .pd-actions { display: flex; justify-content: flex-end; margin-bottom: 10px; }

  .pd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .pd-card {
    border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 18px;
    background: var(--bg-primary); box-shadow: 0 1px 3px rgba(0,0,0,.06);
    cursor: pointer; transition: box-shadow .15s ease, transform .12s ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .pd-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.10); transform: translateY(-2px); border-color: var(--color-brand-primary); }
  .pd-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pd-name { font-size: 15px; font-weight: 800; }
  .pd-goal {
    font-size: 12px; color: var(--text-muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 32px;
  }
  .pd-kw-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pd-kw-pill {
    background: color-mix(in srgb, var(--color-brand-primary) 15%, transparent);
    border: 1px solid var(--color-brand-primary); color: var(--brand-text);
    border-radius: 999px; font-size: 11px; padding: 2px 9px; cursor: pointer;
  }
  .pd-kw-pill:hover { filter: brightness(1.1); }
  .pd-kw-empty { font-size: 11px; color: var(--text-muted); opacity: .7; }
  .pd-progress-row { display: flex; align-items: center; gap: 8px; }
  .pd-progress-row .progress-bar-wrap { flex: 1; }
  .pd-progress-pct { font-size: 11px; color: var(--text-muted); min-width: 32px; text-align: right; }
  .pd-dates { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="ai-shell">
    <div class="ai-gnb" id="ai-gnb-slot"></div>
    <div class="ai-body">
      <nav class="ai-lnb" id="ai-lnb-slot"></nav>
      <div class="ai-content">
        <div class="topbar">
          <div class="topbar-main">
            <h1>⑦ 프로젝트 대시보드</h1>
            <span class="hint">전체 프로젝트의 상태·목표·진행률을 한눈에 확인하고, 카드를 눌러 바로 편집할 수 있습니다.</span>
          </div>
        </div>
        <div class="content-body">
  <div class="pd-header">
    <div class="pd-icon">🗃️</div>
    <div>
      <p class="subtitle">
        모든 프로젝트가 지금 어느 상태(대기 → 진행 → 완료/보류/삭제)에 있는지, 목표·키워드(프레임워크·
        솔루션 태그)·진행률을 한 번에 훑어봅니다.
        <span class="src-note">실시간 <code>GET /projects</code> + <code>GET /projects/{id}</code>를 조합해 집계하며, 별도 저장·캐시는 없습니다.</span>
      </p>
    </div>
  </div>

  <div class="summary-row" id="summary-row"></div>

  <div class="pd-tabs" id="pd-tabs"></div>
  <div class="pd-actions">
    <a class="btn primary" href="project-setup.html" style="text-decoration:none;">+ 새 프로젝트</a>
  </div>

  <div class="pd-grid" id="pd-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

<script src="../js/ui-dialogs.js"></script>
<script src="../js/project-scope.js"></script>
<script src="../js/api.js"></script>
<script src="../js/shell-loader.js"></script>
<script>
// [2026-07-26] 프로젝트 상태(WAITING/IMPLEMENTING/VERIFIED/ON_HOLD/ARCHIVED)는 요구사항
// work_status(WORK_STATUS_META)와는 다른 도메인이라 constants.js의 WORK_STATUS_META를
// 억지로 재사용하지 않고 이 화면 로컬에 별도 맵을 둔다(사용자 지시 판단 위임 반영 —
// "프로젝트 상태" ≠ "Task 작업상태", 혼동 방지).
const PROJECT_STATUS_META = {
  WAITING:      { icon: "⏳", label: "대기", tone: "" },
  IMPLEMENTING: { icon: "⚙️", label: "진행중", tone: "" },
  VERIFIED:     { icon: "✅", label: "완료", tone: "ok" },
  ON_HOLD:      { icon: "⏸", label: "보류", tone: "warn" },
  ARCHIVED:     { icon: "🗑️", label: "삭제", tone: "danger" },
};

// 5분류 탭 정의 — "진행"은 WAITING+IMPLEMENTING을 함께 묶는다(작업 착수 전/중 모두
// "아직 완료되지 않은, 활성 진행 중" 프로젝트로 취급 — 사용자 요청에 명시적 정의가
// 없어 이 화면의 판단으로 결정, 아래 filterFn 주석에도 동일하게 문서화).
const PD_TABS = [
  { key: "ALL", label: "전체", filter: () => true },
  { key: "PROGRESS", label: "진행", filter: (p) => p.status === "WAITING" || p.status === "IMPLEMENTING" },
  { key: "DONE", label: "완료", filter: (p) => p.status === "VERIFIED" },
  { key: "HOLD", label: "보류", filter: (p) => p.status === "ON_HOLD" },
  { key: "DELETED", label: "삭제", filter: (p) => p.status === "ARCHIVED" },
];

let allProjects = []; // GET /projects + per-project detail 병합 결과
let activeTab = "ALL";

function renderSummary(projects) {
  const counts = { WAITING: 0, IMPLEMENTING: 0, VERIFIED: 0, ON_HOLD: 0, ARCHIVED: 0 };
  projects.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
  const progressCount = counts.WAITING + counts.IMPLEMENTING;

  const cards = [
    `<div class="summary-card"><div class="icon">📦</div><div><div class="num">${projects.length}</div><div class="label">전체 프로젝트</div></div></div>`,
    `<div class="summary-card"><div class="icon">⚙️</div><div><div class="num">${progressCount}</div><div class="label">진행중 <span class="badge-work" style="background:var(--hover-tint);margin-left:4px;">WAITING+IMPLEMENTING</span></div></div></div>`,
    `<div class="summary-card ok"><div class="icon">✅</div><div><div class="num">${counts.VERIFIED}</div><div class="label">완료 <span class="badge-work work-DONE" style="margin-left:4px;">VERIFIED</span></div></div></div>`,
    `<div class="summary-card warn"><div class="icon">⏸</div><div><div class="num">${counts.ON_HOLD}</div><div class="label">보류 <span class="badge-work work-IN_PROGRESS" style="margin-left:4px;">ON_HOLD</span></div></div></div>`,
    `<div class="summary-card danger"><div class="icon">🗑️</div><div><div class="num">${counts.ARCHIVED}</div><div class="label">삭제 <span class="badge-work work-BLOCKED" style="margin-left:4px;">ARCHIVED</span></div></div></div>`,
  ];
  document.getElementById("summary-row").innerHTML = cards.join("");
}

function renderTabs() {
  document.getElementById("pd-tabs").innerHTML = PD_TABS.map(t => `
    <button type="button" class="pd-tab ${t.key === activeTab ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>
  `).join("");
  document.querySelectorAll(".pd-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      renderTabs();
      renderGrid();
    });
  });
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDate(d) {
  return d ? d.slice(0, 10) : "미설정";
}

function goEdit(id) {
  location.href = `project-setup.html?project_id=${encodeURIComponent(id)}`;
}

function renderGrid() {
  const tab = PD_TABS.find(t => t.key === activeTab) || PD_TABS[0];
  const items = allProjects.filter(tab.filter);

  if (items.length === 0) {
    document.getElementById("pd-grid").innerHTML = "";
    document.getElementById("empty-state").style.display = "block";
    document.getElementById("empty-state").textContent =
      allProjects.length === 0 ? "아직 등록된 프로젝트가 없습니다 — '+ 새 프로젝트'로 시작하세요." : "이 상태의 프로젝트가 없습니다.";
    return;
  }
  document.getElementById("empty-state").style.display = "none";

  document.getElementById("pd-grid").innerHTML = items.map(p => {
    const meta = PROJECT_STATUS_META[p.status] || { icon: "❓", label: p.status, tone: "" };
    const goal = p.config && p.config.goal ? p.config.goal : "";
    const kws = (p.config && p.config.solution_stack) || [];
    const pct = p.progress ? Math.round(p.progress.progress_pct) : 0;
    const kwHtml = kws.length
      ? kws.map(k => `<span class="pd-kw-pill" onclick="event.stopPropagation(); goEdit('${p.id}')">${escapeHtml(k)}</span>`).join("")
      : `<span class="pd-kw-empty">키워드(솔루션 태그) 없음</span>`;
    return `
      <div class="pd-card" onclick="goEdit('${p.id}')" title="클릭하면 편집 화면으로 이동합니다">
        <div class="pd-card-top">
          <div class="pd-name">${escapeHtml(p.name)}</div>
          <span class="badge-work work-${p.status === 'VERIFIED' ? 'DONE' : p.status === 'ARCHIVED' ? 'BLOCKED' : p.status === 'ON_HOLD' ? 'IN_PROGRESS' : 'NOT_DISPATCHED'}">${meta.icon} ${meta.label}</span>
        </div>
        <div class="pd-goal" title="${escapeHtml(goal)}">${goal ? escapeHtml(goal) : '목표 미입력'}</div>
        <div class="pd-kw-row">${kwHtml}</div>
        <div class="pd-progress-row">
          <div class="progress-bar-wrap"><div class="progress-bar-fill ${pct >= 100 ? 'complete' : ''}" style="width:${pct}%;"></div></div>
          <div class="pd-progress-pct">${pct}%</div>
        </div>
        <div class="pd-dates">📅 ${fmtDate(p.start_date)} ~ ${fmtDate(p.end_date)}</div>
      </div>`;
  }).join("");
}

function getScopeProjectId() {
  return window.AegisProject ? window.AegisProject.getId() : "default";
}

async function init() {
  let listBody;
  try {
    listBody = await window.AegisApi.get("/projects");
  } catch (e) {
    document.getElementById("empty-state").style.display = "block";
    document.getElementById("empty-state").textContent =
      "프로젝트 목록을 불러오지 못했습니다 — file://로 직접 열었거나 서버가 꺼져있을 수 있습니다. " +
      "프로젝트 루트에서 ./restart.sh 실행 후 접속하세요.";
    return;
  }

  const projects = listBody.data.projects || [];
  if (projects.length === 0) {
    renderSummary([]);
    renderTabs();
    document.getElementById("empty-state").style.display = "block";
    document.getElementById("empty-state").textContent = "아직 등록된 프로젝트가 없습니다 — '+ 새 프로젝트'로 시작하세요.";
    return;
  }

  // [CRZ] N+1 신규 벌크 API를 만들지 않고, 프로젝트 수가 통상 범위(수십 건 이하)라는
  // 전제로 병렬 GET /projects/{id} 호출로 config+progress를 병합한다. 개별 상세 조회
  // 실패는 그 카드만 최소정보(리스트값)로 표시하고 전체 화면은 계속 렌더링한다.
  const details = await Promise.all(projects.map(p =>
    window.AegisApi.get(`/projects/${encodeURIComponent(p.id)}`)
      .then(b => b.data)
      .catch(() => ({ ...p, progress: { done_tasks: 0, total_tasks: 0, progress_pct: 0 }, config: null }))
  ));

  allProjects = details;
  renderSummary(allProjects);
  renderTabs();
  renderGrid();
}

init();
</script>
</body>
</html>
