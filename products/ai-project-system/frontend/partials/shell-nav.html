<!--
  공통 GNB(상단 전역 메뉴) + LNB(좌측 업무영역 메뉴) 조각.
  frontend/views/*.html이 JS(fetch + innerHTML)로 이 파일을 읽어 #ai-shell-slot에 삽입한다.

  [2026-07-23 워크플로 순서 개편, 사용자 지시: "프로젝트 배경에서의 내용을 기반으로
  요구사항관리가 그다음 절차로 되고... 전체적인 workflow가 흐름에 맞게"] 메뉴 순서를
  실제 작업 흐름(프로젝트 설정 → 배경 문서 등록 → 그 문서에서 파생된 요구사항 관리 →
  세부 미리보기 → 배차 현황)대로 재배열했다 — 이전에는 "요구사항 관리"가 "문서/청킹
  관리"보다 먼저 나와 있어 메뉴 순서가 실제 의존관계(문서를 올려야 요구사항이 나온다)와
  어긋나 있었다(실측: documents.html이 upload→classify→REQ채번을 하고, requirements.html은
  그 결과만 조회 — 화면 코드 자체는 그대로, 메뉴 순서·표현만 흐름에 맞게 조정). "문서/청킹
  관리"는 이제 "프로젝트 배경(문서 등록)"으로 명명해 역할을 명확히 한다(기능 변경 없음,
  제안서·사업계획서·인터뷰·녹음·메모·회의록 등 배경 문서를 여기서 등록 — doc-types API로
  문서유형 동적 추가 가능).
-->
